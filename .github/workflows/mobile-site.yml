name: Mobile Site

on:
  push:
    branches: [main]
    paths: ['apps/mobile-site/**', 'package.json', 'bun.lock', 'bunfig.toml', '.bun-version', '.github/workflows/mobile-site.yml']
  pull_request:
    paths: ['apps/mobile-site/**', 'package.json', 'bun.lock', 'bunfig.toml', '.bun-version', '.github/workflows/mobile-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:mobile-site
      - run: bun run build:mobile-site
      - run: bun run --cwd apps/mobile-site deploy --dry-run
      - run: bun run --cwd apps/mobile-site verify
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-site
          path: apps/mobile-site/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: mobile-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-workers
      url: https://mobile.omochi.fyi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: mobile-site
          path: apps/mobile-site/dist
      - name: Deploy mobile.omochi.fyi
        run: bun run deploy:mobile-site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
