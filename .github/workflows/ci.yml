name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - uses: dtolnay/rust-toolchain@stable
      - run: bun run test
      - run: bun run --bun --filter '*' lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install mypy pyright build
      - run: python scripts/test-sdk-types.py
      - run: python -m build packages/sdk/python --outdir /tmp/sdk-wheel
      - run: python -m pip install /tmp/sdk-wheel/*.whl
      - run: python -m mypy --follow-imports=silent packages/sdk/python/tests/typing/positive.py
      - run: python -m pyright packages/sdk/python/tests/typing/positive.py
      - run: python -m mypy --follow-imports=silent packages/sdk/python/tests/typing/interface_positive.py
      - run: python -m pyright packages/sdk/python/tests/typing/interface_positive.py
      - run: python -m unittest discover -s packages/sdk/python/tests -v
        env:
          PYTHONPATH: packages/sdk/python/src
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:python-renderer
        env:
          OMOCHI_PYTHON_INSTALLED_TEST: '1'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path packages/sdk/rust/Cargo.toml --check
      - run: cargo test --manifest-path packages/sdk/rust/Cargo.toml --locked
      - run: python3 scripts/check-sdk-crates.py
