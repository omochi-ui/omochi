name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - uses: dtolnay/rust-toolchain@stable
      - run: bun run test
      - run: bun run --bun --filter '*' lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s packages/sdk/python/tests -v
        env:
          PYTHONPATH: packages/sdk/python/src

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path packages/sdk/rust/Cargo.toml --check
      - run: cargo test --manifest-path packages/sdk/rust/Cargo.toml --locked
