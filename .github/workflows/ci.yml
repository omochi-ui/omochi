name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            packages/sdk/rust -> target
            examples/rust -> target
      - run: bun run test
      - run: bun run --bun --filter '*' lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s packages/sdk/python/tests -v
        env:
          PYTHONPATH: packages/sdk/python/src

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sdk/rust -> target
      - run: cargo fmt --manifest-path packages/sdk/rust/Cargo.toml --check
      - run: cargo test --manifest-path packages/sdk/rust/Cargo.toml --locked
