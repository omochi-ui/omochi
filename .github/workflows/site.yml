name: Site
on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'package.json', 'bun.lock', 'bunfig.toml', '.bun-version', '.github/workflows/site.yml']
  pull_request:
    paths: ['apps/site/**', 'package.json', 'bun.lock', 'bunfig.toml', '.bun-version', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:site
      - run: bun run build:site
      - run: bun run --filter @omochi-ui/site verify
      - run: bun run --cwd apps/site deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-workers
      url: https://omochi.fyi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: apps/site/dist
      - name: Deploy omochi.fyi
        run: bun run --cwd apps/site deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
