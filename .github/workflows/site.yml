name: Site
on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'package.json', 'bun.lock', '.bun-version', '.github/workflows/site.yml']
  pull_request:
    paths: ['apps/site/**', 'package.json', 'bun.lock', '.bun-version', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:site
      - run: bun run build:site
      - run: bun run --filter @omochi-ui/site verify
      - run: bun run --cwd apps/site deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist
