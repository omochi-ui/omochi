name: Native services
on:
  pull_request:
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths-ignore: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          workspaces: crates -> target
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - run: python3 -B scripts/test_native_packaging.py
      - run: python3 scripts/package-native.py
      - run: python3 scripts/smoke-native.py artifacts/native/*.tar.gz
      - run: python3 scripts/package-native-npm.py --partial artifacts/native/*.tar.gz
      - run: bun run release:native:smoke:npm
      - if: runner.os == 'Linux'
        run: python3 scripts/package-crates.py --local-sdk
      - run: cargo test --manifest-path crates/Cargo.toml --release --locked --workspace
      - name: Test Bonjour compatibility patch
        run: cargo test --manifest-path vendor/swarm-discovery/Cargo.toml --lib
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/target
      - run: OMOCHI_NATIVE_TEST=1 OMOCHI_NATIVE_PROFILE=release bun test tests/native/mcp.test.ts
      - run: OMOCHI_NATIVE_TEST=1 OMOCHI_NATIVE_PROFILE=release bun test packages/renderer/test/native.test.ts
      - run: cargo clippy --manifest-path crates/Cargo.toml --release --locked --all-targets -- -D warnings
      - name: Cache iroh-relay binary
        if: runner.os == 'Linux'
        id: relay-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/relay-tool
          key: iroh-relay-${{ matrix.os }}-${{ runner.arch }}-1.4.1-server-v1
      - if: runner.os == 'Linux' && steps.relay-cache.outputs.cache-hit != 'true'
        run: cargo install --locked iroh-relay --version '=1.4.1' --features server --root "$RUNNER_TEMP/relay-tool"
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-relay.py "$RUNNER_TEMP/relay-tool/bin/iroh-relay"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: artifacts/native/
          if-no-files-found: error

  windows-transport:
    name: Windows DNS-SD adapter
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-transport
          workspaces: crates -> target
      # The desktop CLI/store still target Unix; compile the shared transport
      # without that feature. Real multicast/VM checks remain opt-in.
      - run: cargo clippy --manifest-path crates/Cargo.toml --locked -p omochi-mdns -p omochi-transport --no-default-features --lib -- -D warnings
