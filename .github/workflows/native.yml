name: Native services
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: bun install --frozen-lockfile
      - run: python3 -B scripts/test_native_packaging.py
      - run: python3 scripts/package-native.py
      - run: python3 scripts/smoke-native.py artifacts/native/*.tar.gz
      - run: python3 scripts/package-native-npm.py --partial artifacts/native/*.tar.gz
      - run: bun run release:native:smoke:npm
      - if: runner.os == 'Linux'
        run: python3 scripts/package-crates.py
      - run: cargo test --manifest-path packages/server-rust/Cargo.toml --release --locked --workspace
      - run: OMOCHI_NATIVE_TEST=1 OMOCHI_NATIVE_PROFILE=release bun test packages/utils/test/native-mcp.test.ts
      - run: OMOCHI_NATIVE_TEST=1 OMOCHI_NATIVE_PROFILE=release bun test packages/renderer/test/native.test.ts
      - run: cargo clippy --manifest-path packages/server-rust/Cargo.toml --release --locked --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo install --locked iroh-relay --version '=1.4.1' --features server --root "$RUNNER_TEMP/relay-tool"
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-relay.py "$RUNNER_TEMP/relay-tool/bin/iroh-relay"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: artifacts/native/
          if-no-files-found: error
