name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'crates/transport/src/relay.rs'
      - 'scripts/build-hub-transport.ts'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.bun-version'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'crates/transport/src/relay.rs'
      - 'scripts/build-hub-transport.ts'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.bun-version'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hub-transport -> target
      - name: Install WASM bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bun run check:dashboard-app
      - run: bun run build:hosted
      - name: Check Worker deployment bundle
        working-directory: apps/dashboard
        run: bunx --no-install wrangler deploy --dry-run
      - name: Verify Worker with built assets
        working-directory: apps/dashboard
        run: node test/preview.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: packages/hub-ui/dist-hosted
          if-no-files-found: error

  deploy:
    needs: dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-workers
      url: https://app.omochi.fyi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: packages/hub-ui/dist-hosted
      - name: Deploy app.omochi.fyi
        working-directory: apps/dashboard
        run: bunx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
