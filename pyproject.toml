[project]
name = "omochi-ui-workspace"
version = "0.1.2"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["packages/sdk/python/src"]
testpaths = ["packages/sdk/python/tests"]

[tool.uv.workspace]
members = [
    "examples/python",
    "packages/sdk/python",
]
