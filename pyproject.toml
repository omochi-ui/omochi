[project]
name = "omochi-ui-workspace"
version = "0.2.2"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["vendor", "artifacts", "crates/cli/tests/fixtures/**/expected.py"]

[tool.pytest.ini_options]
pythonpath = ["packages/sdk/python/src"]
testpaths = ["packages/sdk/python/tests"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pyright>=1.1.400",
    "ruff>=0.17.4",
]

[tool.uv.workspace]
members = [
    "examples/python",
    "packages/sdk/python",
]
