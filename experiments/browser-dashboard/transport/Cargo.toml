[workspace]
resolver = "3"

[package]
name = "omochi-browser-transport"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
futures-util = "0.3"
gloo-timers = { version = "=0.3.0", features = ["futures"] }

[profile.release]
lto = "thin"
opt-level = "s"
