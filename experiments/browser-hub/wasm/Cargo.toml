[package]
name = "omochi-browser-hub-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
hex = "0.4"
console_error_panic_hook = "0.1"
