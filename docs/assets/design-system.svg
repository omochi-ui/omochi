<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title description">
  <title id="title">Omochi design system reference</title>
  <desc id="description">The four requested greens, the flow from an app publishing a Surface through Gateway and Hub to the dashboard, and examples of navigation, buttons, focus, and labeled connection states. Static design reference, not an implemented screen.</desc>
  <!-- Icons and logo are maintained in design-system/. See design-system/README.md for preview and export. -->
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #181f1c; }
      .title { font-size: 28px; font-weight: 600; }
      .heading { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .label { font-size: 14px; font-weight: 600; }
      .meta { font-size: 13px; fill: #526052; }
      .muted { fill: #526052; }
      .inverse { fill: #f5f6f2; }
      .inverse-meta { fill: #cbd3c6; }
      .white { fill: #ffffff; }
      .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#7a846e" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="1080" fill="#f5f6f2"/>

  <use href="design-system/logos/omochi-mark.svg#omochi-mark" x="40" y="32" width="48" height="48"/>
  <text class="title" x="104" y="62">Omochi design system</text>
  <text class="body muted" x="104" y="90">Shared foundations for web, dashboard and Flutter</text>
  <text class="meta" x="1080" y="54" text-anchor="end">STATIC DESIGN REFERENCE</text>

  <text class="heading" x="40" y="140">01  Palette</text>
  <g>
    <rect x="40" y="160" width="248" height="104" rx="12" fill="#181f1c"/>
    <text class="label white" x="60" y="194">Ink · Text and pressed state</text>
    <text class="body mono white" x="60" y="236">#181f1c</text>
    <rect x="304" y="160" width="248" height="104" rx="12" fill="#274029"/>
    <text class="label white" x="324" y="194">Forest · Navigation</text>
    <text class="body mono white" x="324" y="236">#274029</text>
    <rect x="568" y="160" width="248" height="104" rx="12" fill="#315c2b"/>
    <text class="label white" x="588" y="194">Leaf · Primary action</text>
    <text class="body mono white" x="588" y="236">#315c2b</text>
    <rect x="832" y="160" width="248" height="104" rx="12" fill="#60712f"/>
    <text class="label white" x="852" y="194">Olive · Focus</text>
    <text class="body mono white" x="852" y="236">#60712f</text>
  </g>
  <rect x="40" y="284" width="1040" height="54" rx="8" fill="#ffffff" stroke="#d6ddcf"/>
  <text class="label" x="60" y="317">Light work surfaces</text>
  <text class="meta mono" x="248" y="317">Page #f5f6f2</text>
  <text class="meta mono" x="444" y="317">Surface #ffffff</text>
  <text class="meta mono" x="674" y="317">Muted #526052</text>
  <text class="meta" x="1060" y="317" text-anchor="end">6.13:1 on page</text>

  <text class="heading" x="40" y="386">02  Connection model</text>
  <rect x="40" y="406" width="1040" height="180" rx="12" fill="#ffffff" stroke="#d6ddcf"/>
  <g color="#315c2b">
    <use href="design-system/icons/surface.svg#surface" x="150" y="434" width="32" height="32"/>
    <use href="design-system/icons/gateway.svg#gateway" x="414" y="434" width="32" height="32"/>
    <use href="design-system/icons/hub.svg#hub" x="678" y="434" width="32" height="32"/>
    <use href="design-system/icons/surface.svg#surface" x="942" y="434" width="32" height="32"/>
  </g>
  <g class="heading" text-anchor="middle">
    <text x="166" y="494">App</text><text x="430" y="494">Gateway</text>
    <text x="694" y="494">Hub</text><text x="958" y="494">Dashboard</text>
  </g>
  <g class="meta" text-anchor="middle">
    <text x="166" y="518">Publishes a Surface</text><text x="430" y="518">Routes device connections</text>
    <text x="694" y="518">Aggregates gateways</text><text x="958" y="518">Displays the Surface</text>
  </g>
  <g stroke="#7a846e" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M260 476h76"/><path d="M524 476h76"/><path d="M788 476h76"/>
  </g>
  <text class="meta" x="560" y="562" text-anchor="middle">View updates flow right. Actions return to the app. Each connection has its own state.</text>

  <text class="heading" x="40" y="634">03  Components and states</text>
  <rect x="40" y="654" width="232" height="362" rx="12" fill="#274029"/>
  <text class="label inverse-meta" x="64" y="692">WORKSPACE</text>
  <rect x="56" y="716" width="200" height="48" rx="8" fill="#315c2b"/>
  <path d="M57.5 724v32" stroke="#dce8b9" stroke-width="3"/>
  <use href="design-system/icons/surface.svg#surface" x="72" y="730" width="20" height="20" color="#f5f6f2"/>
  <text class="label inverse" x="104" y="745">Dashboards</text>
  <use href="design-system/icons/hub.svg#hub" x="72" y="786" width="20" height="20" color="#cbd3c6"/>
  <text class="label inverse" x="104" y="801">Connections</text>
  <text class="meta inverse-meta" x="64" y="852">Selected = fill + leading line</text>
  <rect x="56" y="924" width="200" height="68" rx="8" fill="#edf2e8"/>
  <use href="design-system/icons/check.svg#check" x="68" y="938" width="20" height="20" color="#274029"/>
  <text class="label" x="96" y="953" fill="#274029">Hub connected</text>
  <text class="meta" x="96" y="978">2 apps available</text>

  <rect x="296" y="654" width="784" height="362" rx="12" fill="#ffffff" stroke="#d6ddcf"/>
  <text class="heading" x="320" y="692">Build workspace</text>
  <text class="meta" x="1056" y="692" text-anchor="end">Example states · no live connection</text>

  <rect x="320" y="716" width="168" height="40" rx="8" fill="#315c2b"/>
  <text class="label white" x="404" y="741" text-anchor="middle">Save dashboard</text>
  <rect x="504" y="716" width="128" height="40" rx="8" fill="#ffffff" stroke="#7a846e"/>
  <text class="label" x="568" y="741" text-anchor="middle">Add view</text>
  <rect x="648" y="716" width="128" height="40" rx="8" fill="#ffffff" stroke="#8b342b"/>
  <text class="label" x="712" y="741" text-anchor="middle" style="fill:#8b342b">Delete</text>
  <rect x="792" y="716" width="128" height="40" rx="8" fill="#edf2e8" stroke="#d6ddcf"/>
  <text class="label muted" x="856" y="741" text-anchor="middle">Saving…</text>
  <text class="meta" x="320" y="782">Primary · 7.79:1</text>
  <text class="meta" x="504" y="782">Secondary</text>
  <text class="meta" x="648" y="782">Danger</text>
  <text class="meta" x="792" y="782">Busy / disabled</text>

  <text class="label" x="320" y="824">Dashboard name</text>
  <rect x="315.5" y="835.5" width="353" height="49" rx="12.5" fill="none" stroke="#60712f" stroke-width="3"/>
  <rect x="320" y="840" width="344" height="40" rx="8" fill="#ffffff" stroke="#7a846e"/>
  <text class="body" x="332" y="866">Build workspace</text>
  <text class="meta" x="696" y="850">Visible label + 3px focus ring</text>
  <text class="meta" x="696" y="874">Text stays readable in every state.</text>

  <rect x="320" y="924" width="164" height="36" rx="18" fill="#edf2e8"/>
  <use href="design-system/icons/check.svg#check" x="332" y="932" width="20" height="20" color="#274029"/>
  <text class="label" x="360" y="947" style="fill:#274029">Connected</text>
  <rect x="500" y="924" width="174" height="36" rx="18" fill="#f5f6f2"/>
  <use href="design-system/icons/clock.svg#clock" x="512" y="932" width="20" height="20" color="#526052"/>
  <text class="label muted" x="540" y="947">Connecting…</text>
  <rect x="690" y="924" width="164" height="36" rx="18" fill="#f5f6f2"/>
  <use href="design-system/icons/offline.svg#offline" x="702" y="932" width="20" height="20" color="#526052"/>
  <text class="label muted" x="730" y="947">Disconnected</text>
  <text class="meta" x="320" y="988">Status = object + icon + label. Motion is optional; meaning is always visible.</text>
  <text class="meta" x="40" y="1052">Source of truth: docs/design-system.md · Light workspace with dark navigation</text>
  <text class="meta" x="1080" y="1052" text-anchor="end">Design kit geometry · Requested palette</text>
</svg>
