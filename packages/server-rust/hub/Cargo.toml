[package]
name = "omochi-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
omochi-protocol = { path = "../protocol" }
omochi-transport = { path = "../transport" }
omochi-ui = { path = "../../sdk/rust" }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
async-stream = "0.3.6"
fs2 = "0.4.3"
url = "2.5.8"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
include_dir = "0.7.4"
[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
omochi-gateway = { path = "../gateway" }
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
