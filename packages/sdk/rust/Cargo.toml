[package]
name = "omochi-ui"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Declarative, transport-independent application runtime for A2UI"
license = "Apache-2.0"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
repository = "https://github.com/omochi-ui/omochi"
homepage = "https://github.com/omochi-ui/omochi"
documentation = "https://github.com/omochi-ui/omochi/blob/main/docs/sdk.md"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
