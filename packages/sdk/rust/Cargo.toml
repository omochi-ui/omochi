[package]
name = "omochi-ui"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Declarative, transport-independent application runtime for A2UI"
license = "Apache-2.0"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
repository = "https://github.com/omochi-ui/omochi"
homepage = "https://github.com/omochi-ui/omochi"
documentation = "https://github.com/omochi-ui/omochi/blob/main/docs/sdk.md"

[features]
default = ["runtime"]
# Embedded renderers only need the transport-independent snapshot materializer.
runtime = ["dep:omochi-ui-macros", "dep:async-trait", "dep:futures", "dep:serde", "dep:tokio", "dep:libc", "dep:omochi-local", "dep:getrandom"]

[dependencies]
omochi-local = { version = "=0.2.2", path = "local", optional = true }
libc = { version = "0.2", optional = true }
omochi-ui-macros = { version = "=0.2.2", path = "macros", optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[workspace]
members = ["macros", "local", "local-node", "local-ffi"]
resolver = "3"
