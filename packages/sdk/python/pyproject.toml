[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omochi-ui"
version = "0.2.2"
description = "Declarative, transport-independent application runtime for A2UI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["typing-extensions>=4.12"]

[project.optional-dependencies]
websocket = ["websockets>=14"]
test = ["pytest>=8", "mypy>=1.18", "pyright>=1.1.400"]

[tool.hatch.build.targets.wheel]
packages = ["src/omochi_ui"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py", "cargo_build.py", "native/Cargo.toml"]

[project.urls]
Repository = "https://github.com/omochi-ui/omochi"
Documentation = "https://github.com/omochi-ui/omochi/blob/main/docs/sdk.md"
Issues = "https://github.com/omochi-ui/omochi/issues"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
