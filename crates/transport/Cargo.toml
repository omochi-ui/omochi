[package]
name = "omochi-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Iroh transport and device enrollment for Omochi"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = ["desktop"]
desktop = ["dep:fs2"]

[dependencies]
base64 = "0.23.1"
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
omochi-protocol = { path = "../protocol", version = "=0.2.1" }
iroh-mdns-address-lookup = "=0.6.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
fs2 = { version = "0.4.3", optional = true }
rand = "0.9"
sha2 = "0.11.1"
hex = "0.4.3"
data-encoding = "2"
n0-future = "0.3.2"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.27.0"

iroh-relay = { version = "=1.4.1", features = ["server"] }
