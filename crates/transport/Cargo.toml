[package]
name = "omochi-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Iroh transport and device enrollment for Omochi"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = ["desktop"]
desktop = ["dep:fs2"]

[dependencies]
base64 = "0.23.1"
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
omochi-protocol = { path = "../protocol", version = "=0.2.1" }
omochi-mdns = { path = "../mdns", version = "=0.2.1" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
fs2 = { version = "0.4.3", optional = true }
rand = "0.9"
sha2 = "0.11.1"
hex = "0.4.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
# The LAN probe can explicitly compare the system backend with raw Rust mDNS.
iroh-mdns-address-lookup = "=0.6.1"
n0-future = "0.3.2"

iroh-relay = { version = "=1.4.1", features = ["server"] }
