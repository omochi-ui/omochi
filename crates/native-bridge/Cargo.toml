[package]
name = "omochi-native-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
omochi-transport = { path = "../transport", default-features = false }
omochi-protocol = { path = "../protocol" }
omochi-ui = { path = "../../packages/sdk/rust", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
omochi-hub = { path = "../hub", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
iroh-dns = "1.4.1"
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"
