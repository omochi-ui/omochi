[package]
name = "omochi-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
tokio.workspace = true
omochi-local = { version = "=0.2.2", path = "../../packages/sdk/rust/local" }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
futures = "0.3"
which = "8"
[dev-dependencies]
tempfile = "3"
