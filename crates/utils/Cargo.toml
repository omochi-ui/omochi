[package]
name = "omochi-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Omochi development utilities and MCP server"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
[dependencies]
omochi-process = { path = "../process", version = "=0.3.2" }
omochi-local = { version = "=0.2.2", path = "../../packages/sdk/rust/local" }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-async-rw"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
similar = "3.2.1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
omochi-ui = { path = "../../packages/sdk/rust", version = "=0.2.2" }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures-util = { version = "0.3", features = ["sink"] }
fs2 = "0.4.3"
omochi-protocol = { path = "../protocol", version = "=0.3.2" }
omochi-local-discovery = { path = "../discovery", version = "=0.3.2" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }
