[package]
name = "omochi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native command-line tools for Omochi application UIs"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
[[bin]]
name = "omochi-ui"
path = "src/main.rs"
[dependencies]
qrcode = { version = "0.14", default-features = false }
anyhow.workspace = true
tokio.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11.1"
hex = "0.4.3"
regex = "1"
serde.workspace = true
toml = "1.1.8"
libc = "0.2"
url = "2.5.8"
omochi-protocol = { path = "../protocol", version = "=0.3.1" }
omochi-transport = { path = "../transport", version = "=0.3.1" }
omochi-gateway = { path = "../gateway", version = "=0.3.1" }
omochi-hub = { path = "../hub", version = "=0.3.1" }
omochi-ui = { path = "../../packages/sdk/rust", version = "=0.2.1" }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.30.0"
tempfile = "3"
