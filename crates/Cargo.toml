[workspace]
members = ["protocol", "transport", "discovery", "gateway", "hub", "cli", "utils", "native-bridge"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/omochi-ui/omochi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
iroh = "=1.4.1"


[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
netdev = { path = "../vendor/netdev" }
netwatch = { path = "../vendor/netwatch" }
swarm-discovery = { path = "../vendor/swarm-discovery" }
