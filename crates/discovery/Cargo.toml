[package]
name = "omochi-local-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local SDK service discovery for Omochi"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
omochi-local = { version = "=0.2.2", path = "../../packages/sdk/rust/local" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
omochi-protocol = { path = "../protocol", version = "=0.3.2" }
notify = "=8.2.2"

[dev-dependencies]
tempfile = "3"
