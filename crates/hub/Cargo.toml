[package]
name = "omochi-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Omochi dashboard hub"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "build.rs", "assets/**"]
[features]
default = ["browser", "desktop"]
browser = ["omochi-transport/file-store", "dep:axum", "dep:async-stream", "dep:fs2", "dep:include_dir"]
desktop = ["omochi-transport/desktop"]

[dependencies]
omochi-local = { version = "=0.2.2", path = "../../packages/sdk/rust/local" }
anyhow.workspace = true
sha2 = "0.11.1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
omochi-protocol = { path = "../protocol", version = "=0.3.2" }
omochi-transport = { path = "../transport", version = "=0.3.2", default-features = false }
omochi-ui = { path = "../../packages/sdk/rust", version = "=0.2.2", default-features = false }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", features = ["sink"] }
async-stream = { version = "0.3.6", optional = true }
fs2 = { version = "0.4.3", optional = true }
url = "2.5.8"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
include_dir = { version = "0.7.4", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
omochi-gateway = { path = "../gateway", version = "=0.3.2" }
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"

# Isolated TLS relay for actual downstream Chromium acceptance.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.4.1", features = ["server"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
